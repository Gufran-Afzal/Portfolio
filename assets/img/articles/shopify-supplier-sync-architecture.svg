<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Shopify supplier feed synchronization architecture</title>
  <desc id="desc">Two supplier XML feeds enter separate Python product and inventory workers on an Ubuntu VPS. Systemd manages both scheduled services. The workers communicate with the Shopify Admin API. Checkpoints and logs are stored on the VPS.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#edf1f5"/></linearGradient>
    <linearGradient id="vps" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#20252d"/><stop offset="1" stop-color="#343c48"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#17202b" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>
      .heading{font:700 28px Inter,Arial,sans-serif;fill:#17202b}.sub{font:400 15px Inter,Arial,sans-serif;fill:#64748b}
      .label{font:700 17px Inter,Arial,sans-serif;fill:#17202b}.body{font:400 14px Inter,Arial,sans-serif;fill:#526071}
      .small{font:600 12px Inter,Arial,sans-serif;fill:#64748b;letter-spacing:1px}
      .light{fill:#fff}.lightbody{fill:#cbd5e1}.line{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}
      .box{fill:#fff;stroke:#dbe2ea;stroke-width:1.5}.green{fill:#e8f5ee;stroke:#b8dfc8}.blue{fill:#eaf2ff;stroke:#c7d9fb}
      .purple{fill:#f1edff;stroke:#d7ccff}
    </style>
  </defs>
  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <text x="64" y="68" class="heading">Shopify supplier feed synchronization</text>
  <text x="64" y="98" class="sub">Two independent scheduled workers · one production VPS · Shopify Admin API</text>

  <!-- supplier feeds -->
  <g filter="url(#shadow)">
    <rect x="58" y="180" width="235" height="130" rx="18" class="box"/>
    <rect x="78" y="202" width="42" height="42" rx="10" class="blue"/>
    <path d="M90 212h17l7 7v17H90z M107 212v8h7 M95 227h14 M95 233h14" fill="none" stroke="#3167bd" stroke-width="2" stroke-linecap="round"/>
    <text x="136" y="220" class="label">Product XML feed</text>
    <text x="136" y="246" class="body">Supplier catalogue</text>
    <text x="78" y="281" class="small">PRODUCT DATA</text>

    <rect x="58" y="390" width="235" height="130" rx="18" class="box"/>
    <rect x="78" y="412" width="42" height="42" rx="10" class="green"/>
    <path d="M88 424h22v17H88z M92 420h14 M92 445v5 M106 445v5" fill="none" stroke="#23824b" stroke-width="2" stroke-linecap="round"/>
    <text x="136" y="430" class="label">Stock XML feed</text>
    <text x="136" y="456" class="body">Supplier quantities</text>
    <text x="78" y="491" class="small">INVENTORY DATA</text>
  </g>

  <!-- VPS boundary -->
  <rect x="350" y="145" width="540" height="450" rx="24" fill="url(#vps)" filter="url(#shadow)"/>
  <text x="382" y="190" class="label light">Ubuntu production VPS</text>
  <text x="382" y="216" class="body lightbody">systemd manages both background services</text>
  <rect x="382" y="242" width="476" height="52" rx="12" fill="#485362"/>
  <circle cx="404" cy="268" r="6" fill="#79d49b"/>
  <text x="424" y="274" class="label light">systemd service manager</text>
  <text x="812" y="273" text-anchor="end" class="body lightbody">Enabled at boot</text>

  <rect x="382" y="326" width="222" height="142" rx="16" fill="#fff"/>
  <rect x="620" y="326" width="238" height="142" rx="16" fill="#fff"/>
  <rect x="400" y="344" width="36" height="36" rx="9" class="blue"/>
  <path d="M410 353h16v18h-16z M414 349h8" fill="none" stroke="#3167bd" stroke-width="2" stroke-linecap="round"/>
  <text x="448" y="360" class="label">Product worker</text>
  <text x="400" y="404" class="body">Python import script</text>
  <text x="400" y="428" class="body">Every 6 hours</text>
  <text x="400" y="450" class="small">CREATE / UPDATE PRODUCTS</text>

  <rect x="638" y="344" width="36" height="36" rx="9" class="green"/>
  <path d="M646 354h20v14h-20z M650 350h12" fill="none" stroke="#23824b" stroke-width="2" stroke-linecap="round"/>
  <text x="686" y="360" class="label">Inventory worker</text>
  <text x="638" y="404" class="body">Python stock sync</text>
  <text x="638" y="428" class="body">Every 45 minutes</text>
  <text x="638" y="450" class="small">UPDATE STOCK LEVELS</text>

  <rect x="382" y="500" width="476" height="64" rx="12" fill="#485362"/>
  <text x="404" y="527" class="label light">Checkpoints + execution logs</text>
  <text x="404" y="548" class="body lightbody">Progress, run history and troubleshooting</text>

  <!-- Shopify -->
  <g filter="url(#shadow)">
    <rect x="955" y="270" width="190" height="205" rx="20" class="box"/>
    <rect x="1008" y="295" width="84" height="84" rx="18" fill="#e8f5ee"/>
    <path d="M1032 321l-5 39h46l-5-39h-36z" fill="#79b85a" stroke="#3c7d37" stroke-width="2"/>
    <path d="M1039 324c0-14 7-23 15-23s15 9 15 23" fill="none" stroke="#3c7d37" stroke-width="4"/>
    <text x="1050" y="412" text-anchor="middle" class="label">Shopify</text>
    <text x="1050" y="438" text-anchor="middle" class="body">Admin API</text>
    <text x="1050" y="459" text-anchor="middle" class="small">LIVE STORE</text>
  </g>

  <!-- arrows -->
  <path d="M293 245H330V397H382" class="line"/>
  <path d="M293 455H330V397H382" class="line"/>
  <path d="M604 397H620" class="line"/>
  <path d="M858 397H955" class="line"/>
  <path d="M858 420H918V420H955" class="line"/>

  <!-- footer notes -->
  <text x="600" y="655" text-anchor="middle" class="small">AUTOMATED SCHEDULES · SEPARATE WORKERS · CENTRALIZED MONITORING</text>
  <text x="600" y="688" text-anchor="middle" class="sub">The dashboard and manual terminal sessions are not required for scheduled synchronization.</text>
</svg>