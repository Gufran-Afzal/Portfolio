<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Shopify supplier feed synchronization architecture</title>
  <desc id="desc">Two supplier XML feeds enter separate product and inventory workers. Both workers run independently under systemd on one Ubuntu VPS and communicate with the Shopify Admin API. Checkpoints and logs are maintained on the VPS.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#edf1f5"/></linearGradient>
    <linearGradient id="vps" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#20252d"/><stop offset="1" stop-color="#343c48"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#17202b" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>
      .heading{font:700 28px Inter,Arial,sans-serif;fill:#17202b}.sub{font:400 15px Inter,Arial,sans-serif;fill:#64748b}
      .label{font:700 17px Inter,Arial,sans-serif;fill:#17202b}.body{font:400 14px Inter,Arial,sans-serif;fill:#526071}
      .small{font:600 12px Inter,Arial,sans-serif;fill:#64748b;letter-spacing:1px}
      .light{fill:#fff}.lightbody{fill:#cbd5e1}.line{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}
      .control{fill:none;stroke:#9aa8b8;stroke-width:2;stroke-dasharray:6 6}
      .box{fill:#fff;stroke:#dbe2ea;stroke-width:1.5}.green{fill:#e8f5ee;stroke:#b8dfc8}.blue{fill:#eaf2ff;stroke:#c7d9fb}
    </style>
  </defs>
  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <text x="64" y="68" class="heading">Shopify supplier feed synchronization</text>
  <text x="64" y="98" class="sub">Independent product and inventory workers · one production VPS · Shopify Admin API</text>

  <g filter="url(#shadow)">
    <rect x="48" y="220" width="220" height="118" rx="18" class="box"/>
    <rect x="68" y="242" width="40" height="40" rx="10" class="blue"/>
    <path d="M79 251h16l7 7v17H79z M95 251v8h7 M84 266h14 M84 272h14" fill="none" stroke="#3167bd" stroke-width="2" stroke-linecap="round"/>
    <text x="122" y="258" class="label">Product XML</text>
    <text x="122" y="282" class="body">Supplier catalogue</text>
    <text x="68" y="313" class="small">PRODUCT DATA</text>

    <rect x="48" y="432" width="220" height="118" rx="18" class="box"/>
    <rect x="68" y="454" width="40" height="40" rx="10" class="green"/>
    <path d="M78 465h20v14H78z M82 461h12 M82 482v5 M94 482v5" fill="none" stroke="#23824b" stroke-width="2" stroke-linecap="round"/>
    <text x="122" y="470" class="label">Stock XML</text>
    <text x="122" y="494" class="body">Supplier quantities</text>
    <text x="68" y="525" class="small">INVENTORY DATA</text>
  </g>

  <rect x="320" y="145" width="570" height="485" rx="24" fill="url(#vps)" filter="url(#shadow)"/>
  <text x="354" y="190" class="label light">Ubuntu production VPS</text>
  <text x="354" y="216" class="body lightbody">Two separately scheduled systemd services</text>

  <rect x="354" y="240" width="502" height="58" rx="12" fill="#485362"/>
  <circle cx="378" cy="269" r="6" fill="#79d49b"/>
  <text x="398" y="275" class="label light">systemd service manager</text>
  <text x="832" y="274" text-anchor="end" class="body lightbody">Boot + restart management</text>
  <path d="M605 298V318H485V340 M605 318H735V340" class="control"/>

  <rect x="354" y="340" width="244" height="150" rx="16" fill="#fff"/>
  <rect x="612" y="340" width="244" height="150" rx="16" fill="#fff"/>
  <rect x="374" y="360" width="36" height="36" rx="9" class="blue"/>
  <path d="M384 369h16v18h-16z M388 365h8" fill="none" stroke="#3167bd" stroke-width="2" stroke-linecap="round"/>
  <text x="422" y="376" class="label">Product worker</text>
  <text x="374" y="420" class="body">Python product import</text>
  <text x="374" y="445" class="body">Every 6 hours</text>
  <text x="374" y="470" class="small">CREATE / UPDATE PRODUCTS</text>

  <rect x="632" y="360" width="36" height="36" rx="9" class="green"/>
  <path d="M640 370h20v14h-20z M644 366h12" fill="none" stroke="#23824b" stroke-width="2" stroke-linecap="round"/>
  <text x="680" y="376" class="label">Inventory worker</text>
  <text x="632" y="420" class="body">Python stock sync</text>
  <text x="632" y="445" class="body">Every 45 minutes</text>
  <text x="632" y="470" class="small">UPDATE STOCK LEVELS</text>

  <rect x="354" y="520" width="502" height="76" rx="12" fill="#485362"/>
  <text x="378" y="550" class="label light">Separate checkpoints + execution logs</text>
  <text x="378" y="575" class="body lightbody">Status script and systemd logs support troubleshooting</text>

  <g filter="url(#shadow)">
    <rect x="970" y="300" width="185" height="190" rx="20" class="box"/>
    <rect x="1020" y="322" width="84" height="78" rx="16" fill="#e8f5ee"/>
    <path d="M1043 345l-5 37h48l-5-37h-38z" fill="#79b85a" stroke="#3c7d37" stroke-width="2"/>
    <path d="M1050 348c0-14 7-22 15-22s15 8 15 22" fill="none" stroke="#3c7d37" stroke-width="4"/>
    <text x="1062" y="430" text-anchor="middle" class="label">Shopify</text>
    <text x="1062" y="455" text-anchor="middle" class="body">Admin API</text>
    <text x="1062" y="475" text-anchor="middle" class="small">LIVE STORE</text>
  </g>

  <path d="M268 279H300V385H354" class="line"/>
  <path d="M268 491H300V445H612" class="line"/>
  <path d="M598 405H930V365H970" class="line"/>
  <path d="M856 445H930V430H970" class="line"/>

  <text x="600" y="685" text-anchor="middle" class="small">PARALLEL WORKERS · INDEPENDENT SCHEDULES · SHARED SHOPIFY DESTINATION</text>
  <text x="600" y="714" text-anchor="middle" class="sub">No worker depends on the other; each can be monitored and troubleshot separately.</text>
</svg>